# Warns before GH_PAT expires.
#
# Every Upptime workflow pushes with GH_PAT. When it expires or is revoked, the
# checks and the page silently stop updating: nothing fails loudly and the page
# keeps showing its last state. This opens an issue, assigned to a person,
# 14 days before expiry, or as soon as the token stops working.
#
# Not one of Upptime's own workflows (those are regenerated by Update Template
# CI); Upptime only replaces its eight named files, so this one survives.
#
# The issue is labelled `token-expiry`, never `status`: the status page lists
# every issue labelled `status` as a public incident.

name: Token expiry check
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check GH_PAT
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ASSIGNEE: mshayanfaisal
          WARN_DAYS: 14
        run: |
          set -euo pipefail
          problem=""
          if [ -z "$GH_PAT" ]; then
            problem="The \`GH_PAT\` secret is missing."
          else
            code=$(curl -s -o /dev/null -D headers.txt -w '%{http_code}' \
              -H "Authorization: Bearer $GH_PAT" "https://api.github.com/repos/$REPO")
            if [ "$code" != "200" ]; then
              problem="\`GH_PAT\` no longer works: GitHub answered HTTP $code. It has expired or been revoked."
            else
              # GitHub sends this header on every call made with an expiring token,
              # e.g. "2027-10-04 21:00:00 UTC".
              exp=$(grep -i '^github-authentication-token-expiration:' headers.txt | cut -d' ' -f2- | tr -d '\r' || true)
              if [ -z "$exp" ]; then
                echo "GH_PAT has no expiry date. Nothing to do."
                exit 0
              fi
              left=$(( ( $(date -d "$exp" +%s) - $(date +%s) ) / 86400 ))
              echo "GH_PAT expires: $exp ($left days left)"
              if [ "$left" -le "$WARN_DAYS" ]; then
                problem="\`GH_PAT\` expires on **$exp** ($left days left)."
              fi
            fi
          fi

          if [ -z "$problem" ]; then exit 0; fi
          echo "$problem"

          open=$(gh issue list -R "$REPO" --state open --label token-expiry --json number --jq length)
          if [ "$open" != "0" ]; then
            echo "A reminder issue is already open."
            exit 0
          fi

          gh label create token-expiry -R "$REPO" --color d93f0b \
            --description "GH_PAT renewal reminder (not a status incident)" --force >/dev/null
          gh issue create -R "$REPO" --label token-expiry --assignee "$ASSIGNEE" \
            --title "Renew the status page token (GH_PAT)" \
            --body "$problem

          Without it, status.threaddesk.io stops updating and keeps showing its last state.

          **To renew:**
          1. https://github.com/settings/personal-access-tokens/new: resource owner **GYBCommerce**, only the \`threaddesk-status\` repository, **Read and write** on Actions, Contents, Issues and Workflows.
          2. In this repo, open Settings → Secrets and variables → Actions, and replace \`GH_PAT\` with the new token.
          3. In Actions, run **Token expiry check** again, then close this issue."
